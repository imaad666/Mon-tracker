<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monad (MON) Price Tracker | Real-time Dashboard</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --monad-purple: #8247E5;
            --monad-purple-light: #9D6EF2;
            --monad-purple-dark: #6B38C7;
            --monad-bg: #0A0A0F;
            --monad-bg-secondary: #13131A;
            --monad-border: #1F1F2E;
            --monad-text: #FFFFFF;
            --monad-text-secondary: #9CA3AF;
            --monad-success: #10B981;
            --monad-error: #EF4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--monad-bg);
            color: var(--monad-text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3 {
            font-family: 'Inter', sans-serif;
        }

        .header {
            background: var(--monad-bg-secondary);
            border-bottom: 1px solid var(--monad-border);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(130, 71, 229, 0.3);
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--monad-purple-light), var(--monad-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .live-badge {
            font-family: 'Roboto Mono', monospace;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--monad-success);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--monad-success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px;
        }

        .coin-header {
            margin-bottom: 32px;
        }

        .coin-title-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .coin-logo-large {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(130, 71, 229, 0.4);
        }

        .coin-info h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .coin-symbol {
            font-family: 'Roboto Mono', monospace;
            color: var(--monad-text-secondary);
            font-size: 16px;
        }

        .rank-badge {
            font-family: 'Roboto Mono', monospace;
            background: rgba(130, 71, 229, 0.1);
            border: 1px solid rgba(130, 71, 229, 0.3);
            color: var(--monad-purple-light);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .price-section {
            display: flex;
            align-items: baseline;
            gap: 20px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .price-main {
            font-size: 56px;
            font-weight: 700;
        }

        .price-change {
            font-family: 'Roboto Mono', monospace;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 20px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
        }

        .price-change.up {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--monad-success);
        }

        .price-change.down {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--monad-error);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--monad-bg-secondary);
            border: 1px solid var(--monad-border);
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--monad-purple);
            transform: translateY(-2px);
        }

        .stat-label {
            font-family: 'Roboto Mono', monospace;
            color: var(--monad-text-secondary);
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            color: var(--monad-text);
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .stat-change {
            font-family: 'Roboto Mono', monospace;
            font-size: 13px;
            font-weight: 600;
        }

        .stat-change.up { color: var(--monad-success); }
        .stat-change.down { color: var(--monad-error); }
        .stat-change.neutral { color: var(--monad-text-secondary); }

        .chart-section {
            background: var(--monad-bg-secondary);
            border: 1px solid var(--monad-border);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 32px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .chart-title {
            font-size: 24px;
            font-weight: 700;
        }

        .timeframe-tabs {
            display: flex;
            gap: 8px;
            background: var(--monad-bg);
            padding: 4px;
            border-radius: 10px;
        }

        .timeframe-btn {
            font-family: 'Roboto Mono', monospace;
            background: transparent;
            border: none;
            color: var(--monad-text-secondary);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .timeframe-btn:hover {
            color: var(--monad-text);
            background: rgba(130, 71, 229, 0.1);
        }

        .timeframe-btn.active {
            background: var(--monad-purple);
            color: var(--monad-text);
        }

        .chart-container {
            position: relative;
            height: 450px;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: var(--monad-text-secondary);
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--monad-border);
            border-top-color: var(--monad-purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            color: var(--monad-error);
            padding: 20px;
            text-align: center;
        }

        .footer {
            font-family: 'Roboto Mono', monospace;
            text-align: center;
            padding: 40px 32px;
            color: var(--monad-text-secondary);
            font-size: 14px;
            border-top: 1px solid var(--monad-border);
            margin-top: 60px;
        }

        .footer a {
            color: var(--monad-purple-light);
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .container { padding: 20px; }
            .price-main { font-size: 40px; }
            .coin-info h1 { font-size: 28px; }
            .chart-container { height: 320px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="logo">
                <img class="logo-icon" src="https://s2.coinmarketcap.com/static/img/coins/64x64/30495.png" alt="Monad">
                <span class="logo-text">Monad Tracker</span>
            </div>
            <div class="live-badge">
                <div class="live-dot"></div>
                <span>LIVE DATA</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="coin-header">
            <div class="coin-title-row">
                <img class="coin-logo-large" src="https://s2.coinmarketcap.com/static/img/coins/64x64/30495.png" alt="Monad">
                <div class="coin-info">
                    <h1>Monad <span class="coin-symbol">MON</span></h1>
                </div>
                <span id="rankBadge" class="rank-badge">Rank #--</span>
            </div>
        </div>

        <div id="priceSection" class="loading">
            <div class="spinner"></div>
            <p>Loading price data...</p>
        </div>

        <div id="statsGrid" class="stats-grid">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>

        <div class="chart-section">
            <div class="chart-header">
                <h2 class="chart-title">Price Chart</h2>
                <div class="timeframe-tabs">
                    <button class="timeframe-btn active" onclick="changeTimeframe(7)">7D</button>
                    <button class="timeframe-btn" onclick="changeTimeframe(30)">30D</button>
                    <button class="timeframe-btn" onclick="changeTimeframe(90)">90D</button>
                </div>
            </div>
            <div id="priceChart" class="chart-container"></div>
        </div>
    </div>

    <div class="footer">
        <p>Data from <a href="https://coinmarketcap.com" target="_blank">CoinMarketCap</a> and <a href="https://www.cryptocompare.com" target="_blank">CryptoCompare</a></p>
        <p style="margin-top: 12px;">Updates every 30 seconds • Not financial advice</p>
    </div>

    <script>
        let chart = null;
        let lineSeries = null;
        let currentTimeframe = 7;
        let currentMarketPrice = null;

        function formatNumber(num) {
            if (num >= 1e9) return '$' + (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return '$' + (num / 1e6).toFixed(2) + 'M';
            if (num >= 1e3) return '$' + (num / 1e3).toFixed(2) + 'K';
            return '$' + num.toFixed(2);
        }

        async function fetchCMCData() {
            try {
                const response = await fetch('/api/cmc');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (data.data && data.data.MON) {
                    return data.data.MON;
                }
                throw new Error('Invalid response');
            } catch (error) {
                console.error('CMC Error:', error);
                return null;
            }
        }

        async function fetchHistoricalData(days) {
            try {
                const response = await fetch(`https://min-api.cryptocompare.com/data/v2/histoday?fsym=MON&tsym=USD&limit=${days}`);
                const data = await response.json();
                return data.Data.Data;
            } catch (error) {
                console.error('CryptoCompare Error:', error);
                return [];
            }
        }

        function updatePriceDisplay(data) {
            const quote = data.quote.USD;
            const change24h = quote.percent_change_24h;
            const isPositive = change24h >= 0;
            currentMarketPrice = quote.price;

            document.getElementById('rankBadge').textContent = `Rank #${data.cmc_rank}`;
            document.getElementById('priceSection').innerHTML = `
                <div class="price-section">
                    <div class="price-main">$${quote.price.toFixed(6)}</div>
                    <div class="price-change ${isPositive ? 'up' : 'down'}">
                        ${isPositive ? '↑' : '↓'} ${Math.abs(change24h).toFixed(2)}%
                    </div>
                </div>
            `;
        }

        function updateStatsGrid(data) {
            const quote = data.quote.USD;
            const marketCapChange = quote.market_cap_change_24h || 0;
            
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">Market Cap</div>
                    <div class="stat-value">${formatNumber(quote.market_cap)}</div>
                    <div class="stat-change ${marketCapChange >= 0 ? 'up' : 'down'}">
                        ${marketCapChange >= 0 ? '↑' : '↓'} ${Math.abs(marketCapChange).toFixed(2)}% (24h)
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">24h Volume</div>
                    <div class="stat-value">${formatNumber(quote.volume_24h)}</div>
                    <div class="stat-change neutral">${data.num_market_pairs} markets</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Circulating Supply</div>
                    <div class="stat-value">${(data.circulating_supply / 1e9).toFixed(2)}B</div>
                    <div class="stat-change neutral">MON tokens</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Supply</div>
                    <div class="stat-value">${(data.total_supply / 1e9).toFixed(2)}B</div>
                    <div class="stat-change neutral">MON tokens</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Fully Diluted Market Cap</div>
                    <div class="stat-value">${formatNumber(quote.fully_diluted_market_cap)}</div>
                    <div class="stat-change neutral">FDV</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Volume/Market Cap</div>
                    <div class="stat-value">${(quote.volume_24h / quote.market_cap * 100).toFixed(2)}%</div>
                    <div class="stat-change neutral">Liquidity</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">1 Hour Change</div>
                    <div class="stat-value">${quote.percent_change_1h >= 0 ? '+' : ''}${quote.percent_change_1h.toFixed(2)}%</div>
                    <div class="stat-change ${quote.percent_change_1h >= 0 ? 'up' : 'down'}">Last hour</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">7 Day Change</div>
                    <div class="stat-value">${quote.percent_change_7d >= 0 ? '+' : ''}${quote.percent_change_7d.toFixed(2)}%</div>
                    <div class="stat-change ${quote.percent_change_7d >= 0 ? 'up' : 'down'}">Last 7 days</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">30 Day Change</div>
                    <div class="stat-value">${quote.percent_change_30d >= 0 ? '+' : ''}${quote.percent_change_30d.toFixed(2)}%</div>
                    <div class="stat-change ${quote.percent_change_30d >= 0 ? 'up' : 'down'}">Last 30 days</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">60 Day Change</div>
                    <div class="stat-value">${quote.percent_change_60d >= 0 ? '+' : ''}${quote.percent_change_60d.toFixed(2)}%</div>
                    <div class="stat-change ${quote.percent_change_60d >= 0 ? 'up' : 'down'}">Last 60 days</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">90 Day Change</div>
                    <div class="stat-value">${quote.percent_change_90d >= 0 ? '+' : ''}${quote.percent_change_90d.toFixed(2)}%</div>
                    <div class="stat-change ${quote.percent_change_90d >= 0 ? 'up' : 'down'}">Last 90 days</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Market Dominance</div>
                    <div class="stat-value">${quote.market_cap_dominance.toFixed(4)}%</div>
                    <div class="stat-change neutral">Of crypto market</div>
                </div>
            `;
        }

        async function updateChart(days = 7) {
            const historicalData = await fetchHistoricalData(days);
            if (historicalData.length === 0) {
                console.error('No historical data available');
                return;
            }

            const refPrice = currentMarketPrice || historicalData[historicalData.length - 1].close;
            console.log('Updating chart with', historicalData.length, 'data points, baseline:', refPrice);

            // Prepare data for TradingView chart
            const chartData = historicalData.map(d => ({
                time: d.time,
                value: d.close
            }));

            // Create chart if it doesn't exist
            if (!chart) {
                chart = LightweightCharts.createChart(document.getElementById('priceChart'), {
                    width: document.getElementById('priceChart').clientWidth,
                    height: 450,
                    layout: {
                        background: { color: '#13131A' },
                        textColor: '#9CA3AF',
                    },
                    grid: {
                        vertLines: { color: '#1F1F2E' },
                        horzLines: { color: '#1F1F2E' },
                    },
                    crosshair: {
                        mode: LightweightCharts.CrosshairMode.Normal,
                    },
                    rightPriceScale: {
                        borderColor: '#1F1F2E',
                    },
                    timeScale: {
                        borderColor: '#1F1F2E',
                        timeVisible: true,
                    },
                });

                lineSeries = chart.addBaselineSeries({
                    baseValue: { type: 'price', price: refPrice },
                    topLineColor: '#10B981',
                    topFillColor1: 'rgba(16, 185, 129, 0.28)',
                    topFillColor2: 'rgba(16, 185, 129, 0.05)',
                    bottomLineColor: '#EF4444',
                    bottomFillColor1: 'rgba(239, 68, 68, 0.05)',
                    bottomFillColor2: 'rgba(239, 68, 68, 0.28)',
                    lineWidth: 2,
                });

                // Handle resize
                window.addEventListener('resize', () => {
                    chart.applyOptions({ width: document.getElementById('priceChart').clientWidth });
                });
            } else {
                // Update baseline
                lineSeries.applyOptions({
                    baseValue: { type: 'price', price: refPrice },
                });
            }

            try {
                lineSeries.setData(chartData);
                chart.timeScale().fitContent();
                console.log('Chart updated successfully with', chartData.length, 'data points');
            } catch (error) {
                console.error('Error setting chart data:', error);
            }
        }

        function changeTimeframe(days) {
            currentTimeframe = days;
            document.querySelectorAll('.timeframe-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            updateChart(days);
        }

        async function updateAllData() {
            const cmcData = await fetchCMCData();
            if (cmcData) {
                updatePriceDisplay(cmcData);
                updateStatsGrid(cmcData);
                updateChart(currentTimeframe);
            } else {
                document.getElementById('priceSection').innerHTML = '<div class="error">⚠️ Error loading data. Please refresh.</div>';
            }
        }

        // Initialize
        updateAllData();
        setInterval(updateAllData, 30000);
    </script>
</body>
</html>
