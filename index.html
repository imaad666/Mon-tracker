<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monad (MON) Price Tracker | Real-time Dashboard</title>
    <link rel="icon" type="image/png" href="montomoon.png">
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --monad-purple: #8247E5;
            --monad-purple-light: #9D6EF2;
            --monad-purple-dark: #6B38C7;
            --monad-bg: #F8F7FF;
            --monad-bg-secondary: #FFFFFF;
            --monad-border: #E5E1FF;
            --monad-text: #1A1A1A;
            --monad-text-secondary: #6B6B6B;
            --monad-success: #10B981;
            --monad-error: #EF4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--monad-bg);
            color: var(--monad-text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3 {
            font-family: 'Inter', sans-serif;
        }

        .header {
            background: var(--monad-bg-secondary);
            border-bottom: 1px solid var(--monad-border);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(130, 71, 229, 0.3);
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--monad-purple-light), var(--monad-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .live-badge {
            font-family: 'Roboto Mono', monospace;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--monad-success);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--monad-success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px;
        }

        .coin-header {
            margin-bottom: 32px;
        }

        .coin-title-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .coin-logo-large {
            width: 64px;
            height: 64px;
            border-radius: 50%;
        }

        .coin-info h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .coin-symbol {
            font-family: 'Roboto Mono', monospace;
            color: var(--monad-text-secondary);
            font-size: 16px;
        }

        .rank-badge {
            font-family: 'Roboto Mono', monospace;
            background: rgba(130, 71, 229, 0.1);
            border: 1px solid rgba(130, 71, 229, 0.3);
            color: var(--monad-purple-light);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .price-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .price-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .price-main {
            font-family: 'Roboto Mono', monospace;
            font-size: 56px;
            font-weight: 700;
            color: #1A1A1A;
            animation: price-pulse 3s ease-in-out infinite;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 1px rgba(110, 84, 255, 0.3));
        }

        .price-main.flash-green {
            animation: flash-green 0.8s ease-out forwards;
        }

        .price-main.flash-red {
            animation: flash-red 0.8s ease-out forwards;
        }


        .moon-tracker {
            margin-top: 40px;
            padding: 32px;
            background: linear-gradient(135deg, rgba(110, 84, 255, 0.05), rgba(130, 71, 229, 0.05));
            border: 2px solid rgba(110, 84, 255, 0.2);
            border-radius: 16px;
            text-align: center;
        }

        .moon-question {
            font-size: 32px;
            font-weight: 700;
            color: #1A1A1A;
            margin-bottom: 16px;
        }

        .moon-status {
            font-family: 'Roboto Mono', monospace;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .moon-status.close {
            color: #6E54FF;
        }

        .moon-status.yes {
            color: #10B981;
            font-size: 36px;
        }

        .moon-distance {
            font-family: 'Roboto Mono', monospace;
            font-size: 18px;
            color: #6B6B6B;
        }

        .moon-distance .amount {
            color: #6E54FF;
            font-weight: 700;
        }


        @keyframes price-pulse {
            0%, 100% {
                filter: drop-shadow(0 0 8px rgba(110, 84, 255, 0.4))
                        drop-shadow(0 0 15px rgba(110, 84, 255, 0.3))
                        drop-shadow(0 0 25px rgba(110, 84, 255, 0.2));
            }
            50% {
                filter: drop-shadow(0 0 12px rgba(110, 84, 255, 0.6))
                        drop-shadow(0 0 25px rgba(110, 84, 255, 0.5))
                        drop-shadow(0 0 40px rgba(110, 84, 255, 0.3));
            }
        }

        @keyframes flash-green {
            0% {
                color: #10B981;
                filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.8))
                        drop-shadow(0 0 30px rgba(16, 185, 129, 0.6))
                        drop-shadow(0 0 50px rgba(16, 185, 129, 0.4));
            }
            15% {
                color: #1A1A1A;
                filter: drop-shadow(0 0 8px rgba(110, 84, 255, 0.4))
                        drop-shadow(0 0 15px rgba(110, 84, 255, 0.3))
                        drop-shadow(0 0 25px rgba(110, 84, 255, 0.2));
            }
            30% {
                color: #10B981;
                filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.8))
                        drop-shadow(0 0 30px rgba(16, 185, 129, 0.6))
                        drop-shadow(0 0 50px rgba(16, 185, 129, 0.4));
            }
            100% {
                color: #1A1A1A;
                filter: drop-shadow(0 0 8px rgba(110, 84, 255, 0.4))
                        drop-shadow(0 0 15px rgba(110, 84, 255, 0.3))
                        drop-shadow(0 0 25px rgba(110, 84, 255, 0.2));
            }
        }

        @keyframes flash-red {
            0% {
                color: #EF4444;
                filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.8))
                        drop-shadow(0 0 30px rgba(239, 68, 68, 0.6))
                        drop-shadow(0 0 50px rgba(239, 68, 68, 0.4));
            }
            15% {
                color: #1A1A1A;
                filter: drop-shadow(0 0 8px rgba(110, 84, 255, 0.4))
                        drop-shadow(0 0 15px rgba(110, 84, 255, 0.3))
                        drop-shadow(0 0 25px rgba(110, 84, 255, 0.2));
            }
            30% {
                color: #EF4444;
                filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.8))
                        drop-shadow(0 0 30px rgba(239, 68, 68, 0.6))
                        drop-shadow(0 0 50px rgba(239, 68, 68, 0.4));
            }
            100% {
                color: #1A1A1A;
                filter: drop-shadow(0 0 8px rgba(110, 84, 255, 0.4))
                        drop-shadow(0 0 15px rgba(110, 84, 255, 0.3))
                        drop-shadow(0 0 25px rgba(110, 84, 255, 0.2));
            }
        }

        .price-change {
            font-family: 'Roboto Mono', monospace;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 20px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
        }

        .price-change.up {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--monad-success);
        }

        .price-change.down {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--monad-error);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stats-grid-5 {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .market-stats-container {
            margin-bottom: 32px;
        }

        .market-stats-top {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .market-stats-bottom {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        @media (max-width: 1200px) {
            .stats-grid-5 {
                grid-template-columns: repeat(3, 1fr);
            }
            .market-stats-top {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .stats-grid-5 {
                grid-template-columns: repeat(2, 1fr);
            }
            .market-stats-top {
                grid-template-columns: repeat(2, 1fr);
            }
            .market-stats-bottom {
                grid-template-columns: 1fr;
            }
        }

        /* Loading Animation */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--monad-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .monad-logo-anim {
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-family: 'Roboto Mono', monospace;
            font-size: 18px;
            color: var(--monad-purple-light);
            letter-spacing: 0.1em;
            animation: pulse-text 2s ease-in-out infinite;
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading-bar {
            width: 300px;
            height: 4px;
            background: var(--monad-border);
            border-radius: 2px;
            margin-top: 20px;
            overflow: hidden;
        }

        .loading-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--monad-purple), var(--monad-purple-light));
            border-radius: 2px;
            animation: loading 2s ease-in-out infinite;
        }

        @keyframes loading {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        .stat-card {
            background: var(--monad-bg-secondary);
            border: 1px solid var(--monad-border);
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--monad-purple);
            transform: translateY(-2px);
        }

        .stat-label {
            font-family: 'Roboto Mono', monospace;
            color: var(--monad-text-secondary);
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            color: var(--monad-text);
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .stat-change {
            font-family: 'Roboto Mono', monospace;
            font-size: 13px;
            font-weight: 600;
        }

        .stat-change.up { color: var(--monad-success); }
        .stat-change.down { color: var(--monad-error); }
        .stat-change.neutral { color: var(--monad-text-secondary); }

        .chart-section {
            background: var(--monad-bg-secondary);
            border: 1px solid var(--monad-border);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 32px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .chart-title {
            font-size: 24px;
            font-weight: 700;
        }

        .timeframe-tabs {
            display: flex;
            gap: 8px;
            background: var(--monad-bg);
            padding: 4px;
            border-radius: 10px;
        }

        .timeframe-btn {
            font-family: 'Roboto Mono', monospace;
            background: transparent;
            border: none;
            color: var(--monad-text-secondary);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .timeframe-btn:hover {
            color: var(--monad-text);
            background: rgba(130, 71, 229, 0.1);
        }

        .timeframe-btn.active {
            background: var(--monad-purple);
            color: var(--monad-text);
        }

        .chart-container {
            position: relative;
            height: 450px;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: var(--monad-text-secondary);
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--monad-border);
            border-top-color: var(--monad-purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            color: var(--monad-error);
            padding: 20px;
            text-align: center;
        }

        .footer {
            font-family: 'Roboto Mono', monospace;
            text-align: center;
            padding: 40px 32px;
            color: var(--monad-text-secondary);
            font-size: 14px;
            border-top: 1px solid var(--monad-border);
            margin-top: 60px;
        }

        .footer a {
            color: var(--monad-purple-light);
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .container { padding: 20px; }
            .price-main { font-size: 40px; }
            .coin-info h1 { font-size: 28px; }
            .chart-container { height: 320px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <img class="monad-logo-anim" src="Monad Brand and Media Kit/Logos/Logomark/Logomark.svg" alt="Monad">
        <div class="loading-text">LOADING MONAD TRACKER</div>
        <div class="loading-bar">
            <div class="loading-bar-fill"></div>
        </div>
    </div>

    <div class="header">
        <div class="header-content">
            <div class="logo">
                <img src="Monad Brand and Media Kit/Logos/Full Logo/Full Logo Default.svg" alt="Monad" style="height: 32px;">
            </div>
            <div class="live-badge">
                <div class="live-dot"></div>
                <span>LIVE DATA</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="coin-header">
            <div class="coin-title-row">
                <img class="coin-logo-large" src="Monad Brand and Media Kit/Logos/Logomark/Logomark.svg" alt="Monad">
                <div class="coin-info">
                    <h1>Monad <span class="coin-symbol">MON</span></h1>
                </div>
                <span id="rankBadge" class="rank-badge">Rank #--</span>
            </div>
        </div>

        <div id="priceSection" class="loading">
            <div class="spinner"></div>
            <p>Loading price data...</p>
        </div>

        <div id="priceChangesGrid" class="stats-grid-5">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>

        <div class="chart-section">
            <div class="chart-header">
                <h2 class="chart-title">Price Chart</h2>
                <div class="timeframe-tabs">
                    <button class="timeframe-btn" onclick="changeTimeframe(7)">7D</button>
                    <button class="timeframe-btn" onclick="changeTimeframe(30)">30D</button>
                    <button class="timeframe-btn active" onclick="changeTimeframe(90)">90D</button>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="priceChart"></canvas>
            </div>
        </div>

        <div id="marketStatsContainer" class="market-stats-container">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>

        <div id="moonTracker" class="moon-tracker">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>Data from <a href="https://coinmarketcap.com" target="_blank">CoinMarketCap</a> and <a href="https://www.cryptocompare.com" target="_blank">CryptoCompare</a></p>
        <p style="margin-top: 12px;">Updates every 30 seconds • Not financial advice</p>
    </div>

    <script>
        let priceChart = null;
        let currentTimeframe = 90;
        let currentMarketPrice = null;
        let previousPrice = null;

        function formatNumber(num) {
            if (num >= 1e9) return '$' + (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return '$' + (num / 1e6).toFixed(2) + 'M';
            if (num >= 1e3) return '$' + (num / 1e3).toFixed(2) + 'K';
            return '$' + num.toFixed(2);
        }

        async function fetchCMCData() {
            try {
                const response = await fetch('/api/cmc');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (data.data && data.data.MON) {
                    return data.data.MON;
                }
                throw new Error('Invalid response');
            } catch (error) {
                console.error('CMC Error:', error);
                return null;
            }
        }

        async function fetchHistoricalData(days) {
            try {
                const response = await fetch(`https://min-api.cryptocompare.com/data/v2/histoday?fsym=MON&tsym=USD&limit=${days}`);
                const data = await response.json();
                return data.Data.Data;
            } catch (error) {
                console.error('CryptoCompare Error:', error);
                return [];
            }
        }

        function updatePriceDisplay(data) {
            const quote = data.quote.USD;
            const change24h = quote.percent_change_24h;
            const isPositive = change24h >= 0;
            const newPrice = quote.price;

            // Check if price changed
            let flashClass = '';
            if (previousPrice !== null && previousPrice !== newPrice) {
                flashClass = newPrice > previousPrice ? 'flash-green' : 'flash-red';
            }
            
            currentMarketPrice = newPrice;
            previousPrice = newPrice;

            document.getElementById('rankBadge').textContent = `Rank #${data.cmc_rank}`;
            document.getElementById('priceSection').innerHTML = `
                <div class="price-section">
                    <div class="price-row">
                        <div class="price-main ${flashClass}">$${quote.price.toFixed(6)}</div>
                        <div class="price-change ${isPositive ? 'up' : 'down'}">
                            ${isPositive ? '↑' : '↓'} ${Math.abs(change24h).toFixed(2)}%
                        </div>
                    </div>
                </div>
            `;

            // Update moon tracker
            updateMoonTracker(quote.price);

            // Remove flash class after animation completes
            if (flashClass) {
                setTimeout(() => {
                    const priceElement = document.querySelector('.price-main');
                    if (priceElement) {
                        priceElement.classList.remove('flash-green', 'flash-red');
                    }
                }, 600);
            }
        }

        function updateMoonTracker(currentPrice) {
            const moonTarget = 1.0;
            const distance = moonTarget - currentPrice;
            const percentToMoon = (currentPrice / moonTarget) * 100;

            let status, statusClass, emoji, message;

            if (currentPrice >= moonTarget) {
                status = "YES! MON HIT THE MOON!";
                statusClass = "yes";
                message = "We made it! 🚀";
            } else if (percentToMoon >= 90) {
                status = "SO CLOSE!";
                statusClass = "close";
                message = `Getting there, <span class="amount">$${distance.toFixed(8)}</span> left`;
            } else if (percentToMoon >= 50) {
                status = "HALFWAY THERE!";
                statusClass = "close";
                message = `Getting there, <span class="amount">$${distance.toFixed(8)}</span> left`;
            } else {
                status = "GETTING THERE";
                statusClass = "close";
                message = `<span class="amount">$${distance.toFixed(8)}</span> left to reach $1.00`;
            }

            document.getElementById('moonTracker').innerHTML = `
                <div class="moon-question">Did MON hit the MOON?</div>
                <div class="moon-status ${statusClass}">${status}</div>
                <div class="moon-distance">${message}</div>
            `;
        }

        function updateStatsGrid(data) {
            const quote = data.quote.USD;
            const marketCapChange = quote.market_cap_change_24h || 0;
            
            // Price changes above chart (5 cards)
            document.getElementById('priceChangesGrid').innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">1 Hour Change</div>
                    <div class="stat-value">${quote.percent_change_1h >= 0 ? '+' : ''}${quote.percent_change_1h.toFixed(2)}%</div>
                    <div class="stat-change ${quote.percent_change_1h >= 0 ? 'up' : 'down'}">Last hour</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">7 Day Change</div>
                    <div class="stat-value">${quote.percent_change_7d >= 0 ? '+' : ''}${quote.percent_change_7d.toFixed(2)}%</div>
                    <div class="stat-change ${quote.percent_change_7d >= 0 ? 'up' : 'down'}">Last 7 days</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">30 Day Change</div>
                    <div class="stat-value">${quote.percent_change_30d >= 0 ? '+' : ''}${quote.percent_change_30d.toFixed(2)}%</div>
                    <div class="stat-change ${quote.percent_change_30d >= 0 ? 'up' : 'down'}">Last 30 days</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">60 Day Change</div>
                    <div class="stat-value">${quote.percent_change_60d >= 0 ? '+' : ''}${quote.percent_change_60d.toFixed(2)}%</div>
                    <div class="stat-change ${quote.percent_change_60d >= 0 ? 'up' : 'down'}">Last 60 days</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">90 Day Change</div>
                    <div class="stat-value">${quote.percent_change_90d >= 0 ? '+' : ''}${quote.percent_change_90d.toFixed(2)}%</div>
                    <div class="stat-change ${quote.percent_change_90d >= 0 ? 'up' : 'down'}">Last 90 days</div>
                </div>
            `;
            
            // Market stats below chart - split into top row (5 cards) and bottom row (2 cards)
            document.getElementById('marketStatsContainer').innerHTML = `
                <div class="market-stats-top">
                    <div class="stat-card">
                        <div class="stat-label">Market Cap</div>
                        <div class="stat-value">${formatNumber(quote.market_cap)}</div>
                        <div class="stat-change ${marketCapChange >= 0 ? 'up' : 'down'}">
                            ${marketCapChange >= 0 ? '↑' : '↓'} ${Math.abs(marketCapChange).toFixed(2)}% (24h)
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">24h Volume</div>
                        <div class="stat-value">${formatNumber(quote.volume_24h)}</div>
                        <div class="stat-change neutral">${data.num_market_pairs} markets</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Circulating Supply</div>
                        <div class="stat-value">${(data.circulating_supply / 1e9).toFixed(2)}B</div>
                        <div class="stat-change neutral">MON tokens</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Total Supply</div>
                        <div class="stat-value">${(data.total_supply / 1e9).toFixed(2)}B</div>
                        <div class="stat-change neutral">MON tokens</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Fully Diluted Market Cap</div>
                        <div class="stat-value">${formatNumber(quote.fully_diluted_market_cap)}</div>
                        <div class="stat-change neutral">FDV</div>
                    </div>
                </div>
                <div class="market-stats-bottom">
                    <div class="stat-card">
                        <div class="stat-label">Volume/Market Cap</div>
                        <div class="stat-value">${(quote.volume_24h / quote.market_cap * 100).toFixed(2)}%</div>
                        <div class="stat-change neutral">Liquidity</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Market Dominance</div>
                        <div class="stat-value">${quote.market_cap_dominance.toFixed(4)}%</div>
                        <div class="stat-change neutral">Of crypto market</div>
                    </div>
                </div>
            `;
        }

        async function updateChart(days = 7) {
            const historicalData = await fetchHistoricalData(days);
            if (historicalData.length === 0) return;

            const labels = historicalData.map(d => {
                const date = new Date(d.time * 1000);
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            });

            const prices = historicalData.map(d => d.close);
            const refPrice = currentMarketPrice || prices[prices.length - 1];

            const ctx = document.getElementById('priceChart').getContext('2d');
            if (priceChart) priceChart.destroy();

            priceChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Price (USD)',
                        data: prices,
                        borderColor: '#8247E5',
                        backgroundColor: 'rgba(130, 71, 229, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 6,
                        pointHoverBackgroundColor: '#8247E5',
                        pointHoverBorderColor: '#fff',
                        pointHoverBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: '#0A0A0F',
                            titleColor: '#9CA3AF',
                            bodyColor: '#FFFFFF',
                            borderColor: '#8247E5',
                            borderWidth: 2,
                            padding: 16,
                            displayColors: false,
                            callbacks: {
                                label: (context) => 'Price: $' + context.parsed.y.toFixed(6)
                            }
                        },
                        annotation: {
                            annotations: {
                                currentPriceLine: {
                                    type: 'line',
                                    yMin: refPrice,
                                    yMax: refPrice,
                                    borderColor: '#8247E5',
                                    borderWidth: 2,
                                    borderDash: [5, 5],
                                    label: {
                                        display: true,
                                        content: 'Current: $' + refPrice.toFixed(6),
                                        position: 'end',
                                        backgroundColor: '#8247E5',
                                        color: '#FFFFFF',
                                        font: {
                                            size: 11,
                                            weight: 'bold'
                                        },
                                        padding: 6
                                    }
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { color: '#9CA3AF', maxTicksLimit: 10 }
                        },
                        y: {
                            grid: { color: '#1F1F2E' },
                            ticks: {
                                color: '#9CA3AF',
                                callback: (value) => '$' + value.toFixed(6)
                            }
                        }
                    }
                }
            });
        }

        function changeTimeframe(days) {
            currentTimeframe = days;
            document.querySelectorAll('.timeframe-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            updateChart(days);
        }

        async function updateAllData() {
            const cmcData = await fetchCMCData();
            if (cmcData) {
                updatePriceDisplay(cmcData);
                updateStatsGrid(cmcData);
                updateChart(currentTimeframe);
            } else {
                document.getElementById('priceSection').innerHTML = '<div class="error">⚠️ Error loading data. Please refresh.</div>';
            }
        }

        // Hide loading screen after data loads
        function hideLoadingScreen() {
            const loadingScreen = document.getElementById('loadingScreen');
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 500);
            }, 1500); // Show for at least 1.5 seconds
        }

        // Initialize
        async function init() {
            await updateAllData();
            await updateChart(currentTimeframe);
            hideLoadingScreen();
        }

        init();
        // Auto-refresh every 30 seconds
        setInterval(updateAllData, 30000);
        
        // Log refresh status
        console.log('🔄 Auto-refresh enabled: Updates every 30 seconds');
    </script>
</body>
</html>
