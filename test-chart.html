<!DOCTYPE html>
<html>
<head>
    <title>Chart Test</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body style="background: #0A0A0F; color: white; font-family: Arial;">
    <h1>TradingView Chart Test</h1>
    <div id="chart" style="width: 800px; height: 400px;"></div>
    
    <script>
        console.log('Starting chart test...');
        console.log('LightweightCharts available:', typeof LightweightCharts !== 'undefined');
        
        // Test data
        const testData = [
            { time: 1715000000, value: 0.020 },
            { time: 1715086400, value: 0.022 },
            { time: 1715172800, value: 0.025 },
            { time: 1715259200, value: 0.028 },
            { time: 1715345600, value: 0.030 },
            { time: 1715432000, value: 0.032 },
            { time: 1715518400, value: 0.031 }
        ];
        
        const baseline = 0.028;
        
        try {
            const chart = LightweightCharts.createChart(document.getElementById('chart'), {
                width: 800,
                height: 400,
                layout: {
                    background: { color: '#13131A' },
                    textColor: '#9CA3AF',
                },
            });
            
            const series = chart.addBaselineSeries({
                baseValue: { type: 'price', price: baseline },
                topLineColor: '#10B981',
                topFillColor1: 'rgba(16, 185, 129, 0.4)',
                topFillColor2: 'rgba(16, 185, 129, 0.1)',
                bottomLineColor: '#EF4444',
                bottomFillColor1: 'rgba(239, 68, 68, 0.1)',
                bottomFillColor2: 'rgba(239, 68, 68, 0.4)',
            });
            
            series.setData(testData);
            console.log('Chart created successfully!');
        } catch (error) {
            console.error('Chart error:', error);
            document.body.innerHTML += '<p style="color: red;">Error: ' + error.message + '</p>';
        }
    </script>
</body>
</html>
